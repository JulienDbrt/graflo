name: newest dependencies

# CI installs from uv.lock; users installing from PyPI get the newest versions
# pyproject.toml admits. This re-resolves to those and runs the container-free
# suites, so a dependency release that breaks graflo shows up without a commit.
on:
    schedule:
    -   cron: '41 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    newest:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
        -   uses: actions/checkout@v7

        -   name: Install uv
            uses: astral-sh/setup-uv@v10.3.0
            with:
                version: "0.12.21"
                python-version: "3.11"
                enable-cache: true
                save-cache: false

        # Prints each package it moves, which is where to look when the run fails.
        -   name: Resolve the newest admitted versions
            run: uv lock --upgrade

        -   name: Install dependencies (dev and plot)
            run: uv sync --locked --extra dev --extra plot

        -   name: Run the container-free suites
            run: uv run pytest test --ignore=test/db -n auto --dist loadfile
