name: Memgraph compatibility

on:
    workflow_dispatch:
    pull_request:
        paths:
        -   graflo/db/memgraph/**
        -   graflo/db/cypher/**
        -   graflo/connections/onto.py
        -   test/db/memgraphs/**
        -   test/db/cypher_cases/**
        -   test/backends/test_memgraph_ddl.py
        -   docker/memgraph/**
        -   pyproject.toml
        -   uv.lock
        -   .github/workflows/memgraph-compatibility.yml

concurrency:
    group: memgraph-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    integration:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                memgraph: ["3.7.1", "3.13.1", "3.14.0"]
        services:
            memgraph:
                image: memgraph/memgraph-mage:${{ matrix.memgraph }}
                ports:
                -   7687:7687
                options: >-
                    --health-cmd "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-start-period 30s
                    --health-retries 20
        steps:
        -   uses: actions/checkout@v7

        -   name: Install uv
            uses: astral-sh/setup-uv@v10.3.0
            with:
                version: "0.12.21"
                python-version: "3.11"
                enable-cache: true

        -   name: Install dependencies
            run: uv sync --locked --extra dev --extra plot

        # A fresh service per matrix job: the suite deletes the whole database.
        # Performance cases remain opt-in, as in the local test command.
        -   name: Run Memgraph integration tests
            run: uv run --frozen pytest test/db/memgraphs
